name: brew test-bot

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

  check:
    name: check whether bottles are needed
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare the formula version with the previous commit and the release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          version_re='s/^  url ".*\/angie-([0-9.]+)\.tar\.gz"$/\1/p'
          version=$(sed -nE "$version_re" Formula/angie.rb)
          previous=""
          if [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]] \
            && git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
            previous=$(git show "${BEFORE}:Formula/angie.rb" | sed -nE "$version_re")
          fi
          assets=$(gh release view "$version" --json assets --jq '.assets[].name' 2>/dev/null || true)

          reason=""
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            reason="manual run"
          elif [[ -z "$previous" ]]; then
            reason="no previous formula to compare with"
          elif [[ "$previous" != "$version" ]]; then
            reason="version ${previous} -> ${version}"
          elif [[ "$EVENT" == "push" ]] && ! grep -q '\.bottle\.tar\.gz$' <<< "$assets"; then
            reason="release ${version} has no bottles yet"
          fi

          if [[ -n "$reason" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building bottles for ${version}: ${reason}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping bottles: ${version} is unchanged and already released" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: [syntax, check]
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Clean up preinstalled runner packages
        run: brew test-bot --only-cleanup-before

      - name: Build bottle
        run: |
          brew install --build-bottle stychos/angie/angie
          version=$(brew info --json=v1 stychos/angie/angie | grep -oE '"stable": *"[^"]+"' | head -1 | cut -d'"' -f4)
          brew bottle --no-rebuild --root-url="https://github.com/${{ github.repository }}/releases/download/${version}" stychos/angie/angie
          for f in ./*--*.bottle.*; do mv "$f" "${f//--/-}"; done

      - name: Upload bottle as artifact
        uses: actions/upload-artifact@v7
        with:
          name: bottle-${{ matrix.os }}
          path: "*.bottle.tar.gz"

  bottle:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all bottle artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bottle-*
          merge-multiple: true

      - name: Create GitHub Release and upload bottles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(printf '%s\n' ./*.bottle.tar.gz | head -1 | sed -E 's/.*angie-([0-9.]+)\..*/\1/')
          # Keep the release and any assets added outside CI (e.g. with bottle-local.sh);
          # only the bottles built by this run are replaced.
          if ! gh release view "$version" >/dev/null 2>&1; then
            gh release create "$version" --title "Angie ${version}" --notes "Bottles for Angie ${version}"
          fi
          gh release upload --clobber "$version" ./*.bottle.tar.gz

      - name: Update formula with bottle block
        shell: bash
        run: |
          version=$(printf '%s\n' ./*.bottle.tar.gz | head -1 | sed -E 's/.*angie-([0-9.]+)\..*/\1/')
          root_url="https://github.com/${{ github.repository }}/releases/download/${version}"
          bottles=()
          for tarball in ./*.bottle.tar.gz; do
            sha256=$(sha256sum "$tarball" | cut -d ' ' -f1)
            os_tag="${tarball%.bottle.tar.gz}"
            os_tag="${os_tag##*.}"
            bottles+=("${os_tag}=${sha256}")
          done
          ruby ./bottle-block.rb Formula/angie.rb "$version" "$root_url" "${bottles[@]}"

      - name: Commit and push bottle update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/angie.rb
          git diff --cached --quiet && exit 0
          git commit -m "updated bottles list"
          git push
