name: brew test-bot

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v6
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

  check:
    name: check whether bottles are needed
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare the formula versions with the previous commit and the release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # package version (upstream version plus _revision) of a formula read from stdin
          pkgver() {
            local source version revision
            source=$(cat)
            version=$(sed -nE 's/^  url ".*\/angie-([0-9.]+)\.tar\.gz"$/\1/p' <<< "$source")
            revision=$(sed -nE 's/^  revision ([0-9]+)$/\1/p' <<< "$source")
            echo "${version}${revision:+_$revision}"
          }
          release=$(sed -nE 's/^  url ".*\/angie-([0-9.]+)\.tar\.gz"$/\1/p' Formula/angie.rb)
          have_previous=0
          if [[ -n "$BEFORE" && "$BEFORE" != 0000000000000000000000000000000000000000 ]] \
            && git fetch --quiet --depth=1 origin "$BEFORE" 2>/dev/null; then
            have_previous=1
          fi
          assets=$(gh release view "$release" --json assets --jq '.assets[].name' 2>/dev/null || true)

          reason=""
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            reason="manual run"
          elif (( ! have_previous )); then
            reason="no previous formula to compare with"
          else
            for formula in angie angie-full; do
              current=$(pkgver < "Formula/${formula}.rb")
              previous=$(git show "${BEFORE}:Formula/${formula}.rb" 2>/dev/null | pkgver)
              if [[ "$previous" != "$current" ]]; then
                reason="${formula} ${previous:-new} -> ${current}"
              elif [[ "$EVENT" == "push" ]] && ! grep -q "^${formula}-${current}\..*\.bottle\.tar\.gz$" <<< "$assets"; then
                reason="release ${release} has no ${formula} ${current} bottles yet"
              fi
              [[ -n "$reason" ]] && break
            done
          fi

          if [[ -n "$reason" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building bottles: ${reason}" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping bottles: formulae unchanged and already released" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: [syntax, check]
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Clean up preinstalled runner packages
        run: brew test-bot --only-cleanup-before

      - name: Build bottles
        run: |
          # conflicts_with makes each formula load the other one, which Homebrew only allows from a trusted tap
          brew trust --tap stychos/angie
          version=$(brew info --json=v1 stychos/angie/angie | grep -oE '"stable": *"[^"]+"' | head -1 | cut -d'"' -f4)
          root_url="https://github.com/${{ github.repository }}/releases/download/${version}"
          # angie and angie-full conflict with each other, so build them one after the other
          for formula in angie angie-full; do
            brew install --build-bottle "stychos/angie/${formula}"
            brew bottle --no-rebuild --root-url="$root_url" "stychos/angie/${formula}"
            brew uninstall "$formula"
          done
          for f in ./*--*.bottle.*; do mv "$f" "${f//--/-}"; done

      - name: Upload bottles as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bottle-${{ matrix.os }}
          path: "*.bottle.tar.gz"

  bottle:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all bottle artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bottle-*
          merge-multiple: true

      - name: Create GitHub Release and upload bottles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's/^  url ".*\/angie-([0-9.]+)\.tar\.gz"$/\1/p' Formula/angie.rb)
          # Keep the release and any assets added outside CI (e.g. with scripts/bottle-local.sh);
          # only the bottles built by this run are replaced.
          if ! gh release view "$version" >/dev/null 2>&1; then
            gh release create "$version" --title "Angie ${version}" --notes "Bottles for Angie ${version}"
          fi
          gh release upload --clobber "$version" ./*.bottle.tar.gz

      - name: Update formulae with bottle blocks
        shell: bash
        run: |
          version=$(sed -nE 's/^  url ".*\/angie-([0-9.]+)\.tar\.gz"$/\1/p' Formula/angie.rb)
          root_url="https://github.com/${{ github.repository }}/releases/download/${version}"
          for formula in angie angie-full; do
            bottles=()
            for tarball in ./"${formula}"-[0-9]*.bottle.tar.gz; do
              [[ -e "$tarball" ]] || continue
              sha256=$(sha256sum "$tarball" | cut -d ' ' -f1)
              os_tag="${tarball%.bottle.tar.gz}"
              os_tag="${os_tag##*.}"
              bottles+=("${os_tag}=${sha256}")
            done
            if (( ${#bottles[@]} )); then
              ruby ./scripts/bottle-block.rb "Formula/${formula}.rb" "$version" "$root_url" "${bottles[@]}"
            fi
          done

      - name: Commit and push bottle update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/angie.rb Formula/angie-full.rb
          git diff --cached --quiet && exit 0
          git commit -m "updated bottles list"
          git push
